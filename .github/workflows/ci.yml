name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check packages tests
      - name: Pytest
        run: pytest

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        working-directory: apps/dashboard
        run: npm ci
      - name: Vitest
        working-directory: apps/dashboard
        run: npm test
      - name: ESLint
        working-directory: apps/dashboard
        run: npm run lint
      - name: TypeScript
        working-directory: apps/dashboard
        run: npx tsc --noEmit
      - name: Production build
        working-directory: apps/dashboard
        run: npm run build
